{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorist Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body> 
    <nav class="navbar">
        <a href="{% url 'home' %}"><img src="{% static 'frsc.jfif' %}" alt="Logo"></a>
        <h1>MOTORIST LOGIN</h1>
        <a href="{% url 'motorist_signup' %}" class="signup-link">Sign Up</a>
    </nav>
    
    <div class="container">
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="License No." required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>

            {% if form.non_field_errors %}
                <div style="color: red; font-size: 14px; margin-top: 10px;">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        </form>
        <p>For new motorists, <a href="{% url 'motorist_signup' %}" class="signup-text">Sign Up</a></p>
    </div>

    <footer class="footer">
        <p>&copy; 2025 Road Ticket Management. All Rights Reserved.</p>
    </footer>

</body>
</html>
